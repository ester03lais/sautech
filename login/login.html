<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SauTec Saúde e Tecnologia - Login</title>
    <link rel="stylesheet" href="../login/css/login.css">
    <script src="../login/js/login.js" defer></script>
</head>
<body>

    <div class="top-logo">
        <img src="../login/css/image/WhatsApp_Image_2026-09-24_at_19.46.45-removebg-preview.png" alt="Ícone Sautec" class="logo-icon">
        <img src="../login/css/image/WhatsApp_Image_2026-09-24_at_19.46.45-removebg-preview - Copia.png" alt="Texto Sautec" class="logo-icon2">
    </div>

    <div class="page-container">

        <div class="welcome-panel">
            <h1>SAÚDE E<br><span class="highlight-green">TECNOLOGIA</span></h1>
            <div class="underline-blue"></div>
            <p>Plataforma inteligente de agendamento e validação de exames ocupacionais.</p>

            <div class="pillars-container">
                <div class="pillar-item">
                    <span class="icon-circle">
                        <!-- Ícone de Segurança (Escudo) -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                    </span>
                    <span>Segurança</span>
                </div>
                <div class="pillar-item">
                    <span class="icon-circle">
                        <!-- Ícone de Conformidade (Usuário/Check) -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <span>Conformidade</span>
                </div>
                <div class="pillar-item">
                    <span class="icon-circle">
                        <!-- Ícone de Agilidade (Raio) -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    </span>
                    <span>Agilidade</span>
                </div>
            </div>
        </div>

        <div class="form-panel">
            <h2 class="form-title">Login</h2>
            
            <form action="#">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>
        </div>

    </div>

</body>
</html>
